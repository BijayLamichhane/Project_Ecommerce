services:
  postgres:
    image: postgres:16-alpine
    container_name: renthub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-renthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renthub_secret}
      POSTGRES_DB: ${POSTGRES_DB:-renthub_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-renthub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - renthub_network

  redis:
    image: redis:7-alpine
    container_name: renthub_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-renthub_redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-renthub_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - renthub_network

  adminer:
    image: adminer:4
    container_name: renthub_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - renthub_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  renthub_network:
    driver: bridge
